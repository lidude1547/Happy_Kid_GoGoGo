<div class="eye-layer" id="eye-boot">
  <div id="boot-mascot"></div>
  <h1>豆豆眼睛遊樂園</h1>
  <p id="boot-msg">準備中…</p>
  <div class="eye-steps"><span data-s="cam">📷 開啟鏡頭</span><span data-s="model">🧠 載入眼睛追蹤</span><span data-s="face">🙂 找到你的臉</span><span data-s="cal">⭐ 眼睛校正</span></div>
  <p class="muted" id="boot-help" style="font-size:17px"></p>
</div>
<div class="eye-layer" id="eye-cal"><div id="cal-text"><h1>看著星星 ⭐</h1><p>頭不要動，只用眼睛看</p></div><div id="cal-star">⭐</div></div>
<div class="eye-banner" id="eye-noface" hidden>🙂 看不到你的臉，請面向鏡頭，坐近一點</div>
<div class="eye-banner" id="eye-mute" hidden>🔇 瀏覽器擋住了聲音：請家人點一下畫面任何地方（只要一次）</div>
<div id="gz-ring"></div>
<div id="gz-cursor" class="off"></div>
<video id="eye-cam" class="hide" playsinline muted></video>
<div id="pos-oval" hidden></div><p id="pos-msg" hidden></p>

<div class="ov" id="ov-eyenew"><div class="sheet" style="max-width:760px">
  <div id="eyenew-mascot"></div><h2>你幾歲呢？用眼睛看著答案</h2>
  <div class="q-opts" id="eyenew-ages"></div>
</div></div>

<div class="ov" id="ov-eye"><div class="sheet" style="max-width:820px">
  <h2>👀 眼睛設定</h2>
  <div class="eye-set" id="eye-set"></div>
</div></div>

<div class="ov" id="ov-calres"><div class="sheet" style="max-width:820px">
  <h2>校正結果</h2><p style="font-size:30px;font-weight:900;margin:0" id="calres-score"></p><p class="muted" id="calres-mode"></p><p class="muted" id="calres-tip" style="font-size:16px"></p>
  <div class="q-opts"><button class="opt" id="calres-go" data-ok="1"><span class="emo">▶️</span><small>開始玩</small></button><button class="opt" id="calres-again"><span class="emo">⭐</span><small>再校正一次</small></button></div>
</div></div>
